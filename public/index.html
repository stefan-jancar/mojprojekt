<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Môj priestor</title>
  <meta name="description" content="Osobný priestor na projekty, dokumenty, školu, prácu a účty.">
  <meta name="theme-color" content="#07070d">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/theme.css?v=11">
  <link rel="stylesheet" href="/css/app.css?v=11">
  <script>
    try {
      var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <main id="app"><div class="spinner"></div></main>
  <nav class="nav glass" id="nav" hidden></nav>
  <div id="layer"></div>
  <script type="module" src="/js/app.js?v=11"></script>
</body>
</html>
