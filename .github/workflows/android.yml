name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
      - '.github/signing/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Inštalácia
        run: npm install

      - name: Konfigurácia (adresa aplikácie)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node configure.mjs

      - name: Android projekt + ikony
        run: |
          npx cap add android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Stály podpisový kľúč
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Chýba tajný údaj KEYSTORE_PASSWORD – APK sa podpíše náhodným kľúčom a aktualizácia bude vyžadovať odinštalovanie."
            exit 0
          fi
          mkdir -p ~/.android
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../.github/signing/debug.keystore.enc -out ~/.android/debug.keystore -pass env:KEYSTORE_PASSWORD
          if [ -n "$ANDROID_USER_HOME" ]; then mkdir -p "$ANDROID_USER_HOME" && cp ~/.android/debug.keystore "$ANDROID_USER_HOME/"; fi
          echo "Podpisový kľúč pripravený."

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../MojPriestor.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MojPriestor-apk
          path: mobile/MojPriestor.apk

      - name: Vydanie (release) na stiahnutie do mobilu
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Môj priestor – APK ${{ github.run_number }}
          body: Stiahni MojPriestor.apk do mobilu a nainštaluj (povoľ inštaláciu z neznámych zdrojov).
          files: mobile/MojPriestor.apk
