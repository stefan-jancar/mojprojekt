name: Moja plocha APK

# Vlastný launcher (domovská obrazovka) – dve plochy vedľa seba, sekcie a priečinky aplikácií.
# Na vetve main sa APK zverejní ako vydanie (release), na ostatných vetvách sa len overí zostavenie.
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/signing/**'
      - '.github/workflows/launcher-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Stály podpisový kľúč
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Chýba tajný údaj KEYSTORE_PASSWORD – APK sa podpíše náhodným kľúčom a aktualizácia bude vyžadovať odinštalovanie."
            exit 0
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../.github/signing/debug.keystore.enc -out "$RUNNER_TEMP/app.keystore" -pass env:KEYSTORE_PASSWORD
          keytool -list -v -keystore "$RUNNER_TEMP/app.keystore" -storepass android | grep -E "Alias name|SHA256:"
          echo "APP_KEYSTORE=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"
          echo "Podpisový kľúč pripravený."

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
          if [ -n "$APP_KEYSTORE" ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            ALIAS=$(keytool -list -keystore "$APP_KEYSTORE" -storepass android | awk -F, '/PrivateKeyEntry/ {print $1; exit}')
            "$BT/apksigner" sign --ks "$APP_KEYSTORE" --ks-pass pass:android --key-pass pass:android --ks-key-alias "$ALIAS" \
              --v4-signing-enabled false --out MojaPlocha.apk app/build/outputs/apk/debug/app-debug.apk
            echo "Podpis APK (musí byť pri každom vydaní rovnaký):"
            "$BT/apksigner" verify --print-certs MojaPlocha.apk | grep -i "SHA-256"
          else
            cp app/build/outputs/apk/debug/app-debug.apk MojaPlocha.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MojaPlocha-apk
          path: launcher/MojaPlocha.apk

      - name: Vydanie (release) na stiahnutie
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plocha-apk-${{ github.run_number }}
          name: Moja plocha – APK ${{ github.run_number }}
          make_latest: false
          body: |
            **Moja plocha** – vlastná domovská obrazovka: dve plochy vedľa seba, sekcie (priečinky) aplikácií v tvojom poradí, minimalizovanie plochy.

            **Inštalácia:** stiahni `MojaPlocha.apk` nižšie v časti Assets, otvor ho a povoľ inštaláciu z neznámych zdrojov.
            Potom v aplikácii ⋮ → *Nastaviť ako predvolenú plochu* (alebo Nastavenia → Aplikácie → Predvolené aplikácie → Domovská obrazovka).
          files: launcher/MojaPlocha.apk
