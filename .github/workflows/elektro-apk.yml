name: Elektro APK

# Samostatná offline aplikácia Elektro (kvíz, nástroje, Beckhoff svorky, rozvádzač) pre kolegov.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'elektro-app/**'
      - 'public/js/elektro.js'
      - 'public/js/tools.js'
      - 'public/js/beckhoff.js'
      - 'public/js/cabinet.js'
      - 'public/js/icons.js'
      - 'public/css/**'
      - 'public/data/**'
      - 'backend/elektro_data/**'
      - '.github/signing/**'
      - '.github/workflows/elektro-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elektro-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Stály podpisový kľúč
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::warning::Chýba tajný údaj KEYSTORE_PASSWORD – APK sa podpíše náhodným kľúčom a aktualizácia bude vyžadovať odinštalovanie."
            exit 0
          fi
          mkdir -p ~/.android
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in ../.github/signing/debug.keystore.enc -out ~/.android/debug.keystore -pass env:KEYSTORE_PASSWORD
          if [ -n "$ANDROID_USER_HOME" ]; then mkdir -p "$ANDROID_USER_HOME" && cp ~/.android/debug.keystore "$ANDROID_USER_HOME/"; fi
          echo "Podpisový kľúč pripravený."

      - name: Inštalácia
        run: npm install

      - name: Poskladanie aplikácie (www)
        env:
          ELEKTRO_VERSION: ${{ github.run_number }}
        run: node build.mjs

      - name: Android projekt + ikony
        run: |
          npx cap add android
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Elektro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Elektro-apk
          path: elektro-app/Elektro.apk

      - name: Vydanie (release) na stiahnutie
        uses: softprops/action-gh-release@v2
        with:
          tag_name: elektro-apk-${{ github.run_number }}
          name: Elektro – APK ${{ github.run_number }}
          make_latest: false
          body: |
            Samostatná aplikácia **Elektro** – príprava na skúšku do 1000 V, kalkulačky, Beckhoff svorky a rozvádzač so simuláciou zapojenia.
            Funguje offline, bez prihlásenia. Výsledky a rozvádzače sa ukladajú len v telefóne.

            **Inštalácia:** stiahni `Elektro.apk` nižšie v časti Assets, otvor ho a povoľ inštaláciu z neznámych zdrojov.
          files: elektro-app/Elektro.apk
